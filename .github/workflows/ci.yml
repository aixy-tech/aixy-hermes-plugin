name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install lint tooling
        run: python -m pip install --disable-pip-version-check ruff==0.17.2
      - name: Check Python source
        run: |
          ruff check .
          ruff format --check .
      - name: Run offline plugin tests
        run: python -m unittest discover -s tests -v
